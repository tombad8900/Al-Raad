name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Rust and NDK for the adblock engine
        # Builds core/adblocker/native for the Android ABIs (via Gradle) and for the host (native-load smoke test).
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          test -n "$ANDROID_NDK_LATEST_HOME" && echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          cargo build --release --locked --manifest-path core/adblocker/native/Cargo.toml
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.14.1-android-all

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prefetch Robolectric android-all artifacts
        run: |
          set -e
          dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-12650502-i7"
          base="https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/15-robolectric-12650502-i7"
          mkdir -p "$dir"
          for f in pom jar; do
            name="android-all-instrumented-15-robolectric-12650502-i7.$f"
            if [ ! -s "$dir/$name" ]; then
              curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 -o "$dir/$name" "$base/$name"
            fi
          done

      - name: Run quality gates and build debug APK
        run: ./gradlew --no-daemon ktlintCheck detekt test assembleDebug assembleDebugAndroidTest

      - name: Upload Wave 3 debug APK artifact
        if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: al-raad-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator-android-test:
    name: emulator androidTest (main)
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Rust and NDK for the adblock engine
        # Builds core/adblocker/native for the Android ABIs (via Gradle) and for the host (native-load smoke test).
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          test -n "$ANDROID_NDK_LATEST_HOME" && echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          cargo build --release --locked --manifest-path core/adblocker/native/Cargo.toml
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.14.1-android-all

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Serve playback fixture from the runner
        # Keeps the ~20MB fixture and its serving buffers out of the instrumented
        # process (OOM root-cause experiment, runs 46100573832/46102894650): the app
        # reaches the runner over the emulator's 10.0.2.2 host alias. Full 200
        # responses are fine host-side; memory pressure was the in-process copies.
        run: |
          mkdir -p /tmp/fixture-serve
          curl -fsSL --retry 3 -o /tmp/fixture-serve/fixture.mp4 https://storage.googleapis.com/exoplayer-test-media-0/BigBuckBunny_320x180.mp4
          printf '%s' "<html><body><video autoplay muted playsinline src='/fixture.mp4'></video></body></html>" > /tmp/fixture-serve/player.html
          nohup python3 -m http.server 18080 --directory /tmp/fixture-serve > /tmp/fixture-serve.log 2>&1 &
          sleep 2
          curl -fsSI http://127.0.0.1:18080/player.html | head -1

      - name: Run instrumentation tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          # The test writes the screenshot to the public Downloads collection via
          # MediaStore (survives scoped storage and post-test package removal; run
          # 45987678975 showed the package lookup failing at pull time). Clear any
          # stale file first, then require a non-empty PNG from this run.
          # IMPORTANT: android-emulator-runner executes this script LINE BY LINE and
          # aborts the remaining lines at the first non-zero exit. Multi-line error
          # handling (set +e / code=$?) cannot work, so the test run and the evidence
          # pulls are wrapped in ONE bash -c line: a failing scenario still uploads.
          script: |
            adb shell settings put global cached_apps_freezer disabled || true
            adb shell rm -f /sdcard/Download/app-launch.png /sdcard/Download/diagnostics-export.txt /sdcard/Download/scenario-*.png || true
            mkdir -p scenario-captures
            nohup bash -c 'while true; do echo "$(date -u +%T) state=$(adb get-state 2>&1 | head -1) qemu=$(pgrep -c qemu-system) hostmem=$(free -m | awk "/Mem:/{print \$7}")MB avail"; sleep 3; done' > scenario-captures/heartbeat.txt 2>&1 &
            nohup adb logcat -v threadtime > scenario-captures/logcat-full.txt 2>&1 &
            bash -c 'timeout 600 ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.alraad.app.RuntimeEvidenceTest,com.alraad.app.RuntimePageLoadTest -Pandroid.testInstrumentationRunnerArguments.fixtureBaseUrl=http://10.0.2.2:18080; code=$?; adb pull /sdcard/Download/app-launch.png app-launch.png || true; adb pull /sdcard/Download/diagnostics-export.txt diagnostics-export.txt || true; for f in $(adb shell ls /sdcard/Download/scenario-*.png 2>/dev/null | tr -d "\r"); do adb pull "$f" scenario-captures/ || true; done; adb logcat -d -t 2000 > scenario-captures/logcat-tail.txt || true; if [ "$code" -eq 0 ]; then test -s app-launch.png; test -s diagnostics-export.txt; [ "$(head -c 8 app-launch.png | od -An -tx1 | tr -d " \n")" = "89504e470d0a1a0a" ]; fi; exit $code' 

      - name: Upload app-launch screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-launch-screenshot
          path: app-launch.png
          if-no-files-found: warn

      - name: Upload diagnostics export
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-export
          path: diagnostics-export.txt
          if-no-files-found: warn

      - name: Upload scenario captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-captures
          path: scenario-captures/
          if-no-files-found: warn

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: androidTest-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
