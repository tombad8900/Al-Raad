build:
  maxIssues: 0
config:
  validation: true
  warningsAsErrors: false
naming:
  FunctionNaming:
    ignoreAnnotated: [ 'Composable' ]
  TopLevelPropertyNaming:
    active: true
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  WildcardImport:
    active: true
complexity:
  LongParameterList:
    functionThreshold: 8
