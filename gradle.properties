# Heap is intentionally modest so builds fit small local machines; CI runners have far more RAM.
org.gradle.jvmargs=-Xmx896m -XX:+UseSerialGC -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx640m
# Avoid a second Kotlin compile JVM on memory-constrained machines
kotlin.compiler.execution.strategy=in-process
