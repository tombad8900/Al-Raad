# CI runners have plenty of RAM; keep local overrides in ~/.gradle/gradle.properties on small machines.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1g
# Avoid a second Kotlin compile JVM on memory-constrained machines
kotlin.compiler.execution.strategy=in-process
